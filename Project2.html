
<!DOCTYPE html>
<html>
<head>
    <title>Real-Time Character Counter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: white;
            padding: 25px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: none;
            font-size: 14px;
        }

        .counter {
            text-align: right;
            margin-top: 10px;
            font-size: 14px;
            color: gray;
        }

        .warning {
            color: red;
            font-size: 13px;
            margin-top: 8px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Message Box</h2>

        <label for="message">Enter your message:</label>

        <textarea
            id="message"
            placeholder="Type your message here..."
            maxlength="200"></textarea>

        <p class="counter" id="counter">
            0/200 characters | 200 remaining
        </p>

        <p class="warning" id="warning"></p>

    </div>

    <script>

        // Select HTML elements
        const message = document.getElementById("message");
        const counter = document.getElementById("counter");
        const warning = document.getElementById("warning");

        // Set maximum character limit
        const maxLength = 200;

        // Add input event listener
        message.addEventListener("input", function() {

            // Count the characters typed
            let typedCharacters = message.value.length;

            // Calculate remaining characters
            let remainingCharacters = maxLength - typedCharacters;

            // Display character count
            counter.textContent =
                typedCharacters + "/" + maxLength +
                " characters | " + remainingCharacters +
                " remaining";

            // Check character limit
            if (typedCharacters === maxLength) {

                warning.textContent =
                    "Warning: You have reached the 200 character limit!";

            } else {

                warning.textContent = "";

            }

        });

    </script>

</body>
</html>
